<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Think-Tech · Mi Carrito</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../js/scripts.js"></script>
  <link rel="stylesheet" href="../../css/general.css">
</head>
<body>
    <!-- NAVBAR (Igual al de pc.html) -->
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
          <a class="navbar-brand" href="index.html">
              <img src="../../resources/logopagina.png" width="60" alt="Logo">
          </a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navMain">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
              <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
              <li class="nav-item"><a class="nav-link" href="pc.html">Computadoras</a></li>
              <li class="nav-item"><a class="nav-link" href="acces.html">Accesorios</a></li>
            </ul>
            <ul class="navbar-nav ms-auto">
              <li class="nav-item">
                <a class="nav-link fw-bold text-primary active" href="carrito.html">🛒 Carrito (<span id="contador-carrito">0</span>)</a>
              </li>
            </ul>
          </div>
        </div>
      </nav>

    <!-- CONTENIDO DEL CARRITO -->
    <main class="container py-5">
        <h2 class="mb-4 fw-bold">Mi carrito de compras</h2>
        
        <div class="row">
            <!-- Columna Izquierda: Lista de Productos generada por JS -->
            <section class="col-lg-8" id="lista-carrito">
                <!-- Aquí JavaScript inyectará los <article> de los productos -->
            </section>

            <!-- Columna Derecha: Resumen de Compra -->
            <aside class="col-lg-4">
                <div class="card bg-light border-0 shadow-sm">
                    <div class="card-body p-4">
                        <h4 class="card-title mb-4">Resumen</h4>
                        <div class="d-flex justify-content-between mb-3">
                            <span class="text-muted">Total a pagar:</span>
                            <strong class="fs-4 text-primary" id="total-carrito">$0</strong>
                        </div>
                        <hr>
                        <div class="mb-3">
                            <label for="cupon" class="form-label small text-muted">Ingrese el cupón de descuento</label>
                            <div class="input-group">
                                <input type="text" class="form-control" id="cupon" placeholder="Ej: DUOC2026">
                                <button class="btn btn-outline-secondary" type="button">Aplicar</button>
                            </div>
                        </div>
                        <button class="btn btn-success w-100 fw-bold py-2 mt-3">PAGAR</button>
                    </div>
                </div>
            </aside>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="border-top py-4 text-center text-muted small mt-5">
        © 2026 Think-Tech. Todos los derechos reservados.
    </footer>

    <!--conexion con js-->
    <script src="../../js/scripts.js"></script>

</body>
</html>
