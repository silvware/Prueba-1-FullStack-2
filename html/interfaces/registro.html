    <!-- REGISTRO -->
    <main class="container py-5">
        <section class="row justify-content-center">
            <article class="col-12 col-md-8 col-lg-5">
                <div class="card border-0 shadow-sm p-4">
                    <h2 class="text-center mb-4 fw-bold">Crea tu cuenta</h2>
                    
                    <!-- Validación de registro conectada a JS -->
                    <form id="formulario-registro" onsubmit="registrarUsuario(event)">
                        <div class="mb-3">
                            <label for="nombreRegistro" class="form-label">Nombre Completo</label>
                            <input type="text" class="form-control" id="nombreRegistro" required>
                        </div>
                        <div class="mb-3">
                            <label for="emailRegistro" class="form-label">Correo Electrónico</label>
                            <input type="email" class="form-control" id="emailRegistro" required>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="pass1Registro" class="form-label">Contraseña</label>
                                <!-- Agrupamos el input y el botón -->
                                <div class="input-group">
                                    <input type="password" class="form-control" id="pass1Registro" required>
                                    <button class="btn btn-outline-secondary" type="button" onclick="mostrarOcultarPass('pass1Registro', this)">👁️</button>
                                </div>
                            </div>
                            <div class="col-md-6 mb-4">
                                <label for="pass2Registro" class="form-label">Repetir Contraseña</label>
                                <!-- Agrupamos el input y el botón -->
                                <div class="input-group">
                                    <input type="password" class="form-control" id="pass2Registro" required>
                                    <button class="btn btn-outline-secondary" type="button" onclick="mostrarOcultarPass('pass2Registro', this)">👁️</button>
                                </div>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-success w-100 fw-bold py-2">REGISTRARME</button>
                    </form>

                    <div class="text-center mt-3 small">
                        ¿Ya tienes cuenta? <a href="login.html" class="text-decoration-none fw-bold">Inicia sesión</a>
                    </div>
                </div>
            </article>
        </section>
    </main>
