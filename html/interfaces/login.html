            <ul class="navbar-nav me-auto mb-2 mb-lg-0">

    <!-- CONTENIDO PRINCIPAL: LOGIN -->
    <main class="container py-5">
        <section class="row justify-content-center">
            <article class="col-12 col-md-6 col-lg-4">
                <div class="card border-0 shadow-sm p-4">
                    <h2 class="text-center mb-4 fw-bold">Iniciar Sesión</h2>
                    
                    <!-- FORMULARIO PARA QUE TU COMPAÑERO VALIDE -->
                    <form id="formulario-login">
                        <div class="mb-3">
                            <label for="emailLogin" class="form-label">Correo Electrónico</label>
                            <input type="email" class="form-control" id="emailLogin" placeholder="ejemplo@correo.com">
                            <div id="error-email-login" class="text-danger small mt-1 d-none"></div>
                        </div>
                        <div class="mb-4">
                            <label for="passLogin" class="form-label">Contraseña</label>
                            <input type="password" class="form-control" id="passLogin" placeholder="********">
                            <div id="error-pass-login" class="text-danger small mt-1 d-none"></div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 fw-bold py-2">ENTRAR</button>
                    </form>

                    <div class="text-center mt-3 small">
                        ¿No tienes cuenta? <a href="registro.html" class="text-decoration-none fw-bold">Regístrate aquí</a>
                    </div>
                </div>
            </article>
        </section>
