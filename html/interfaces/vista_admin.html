<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Think-Tech · Admin Simple</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
  <link rel="stylesheet" href="../../css/general.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
</head>
<body class="bg-light">

    <nav class="navbar bg-white border-bottom shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">
                <img src="../../resources/logopagina.png" width="40" alt="Logo" class="me-2">
                Think-Tech <span class="badge bg-danger ms-1">ADMIN</span>
            </a>
            <a href="login.html" class="btn btn-outline-danger btn-sm fw-bold">Salir</a>
        </div>
    </nav>

    <main class="container py-4">
        
        <section class="card border-0 shadow-sm p-4 mb-4 bg-white">
            <h4 class="fw-bold mb-3">Añadir Nuevo Producto</h4>
            <form id="form-simple-producto">
                <div class="row g-3">
                    <div class="col-md-3">
                        <label for="nombreProducto" class="form-label small fw-bold">Nombre</label>
                        <input type="text" id="nombreProducto" class="form-control" placeholder="Ej: Mouse Gamer" required>
                    </div>
                    <div class="col-md-3">
                        <label for="categoriaProducto" class="form-label small fw-bold">Categoría</label>
                        <select id="categoriaProducto" class="form-select" required>
                            <option value="Computadoras">Computadoras</option>
                            <option value="Accesorios">Accesorios</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label for="precioProducto" class="form-label small fw-bold">Precio ($)</label>
                        <input type="number" id="precioProducto" class="form-control" placeholder="19990" min="0" required>
                    </div>
                    <!-- NUEVO CAMPO DE STOCK -->
                    <div class="col-md-2">
                        <label for="stockProducto" class="form-label small fw-bold">Stock</label>
                        <input type="number" id="stockProducto" class="form-control" placeholder="Ej: 10" min="0" required>
                    </div>
                    <div class="col-md-2 d-flex align-items-end">
                        <button type="submit" class="btn btn-success w-100 fw-bold">+ Agregar</button>
                    </div>
                </div>
            </form>
        </section>

        <section class="card border-0 shadow-sm p-4 bg-white">
            <h4 class="fw-bold mb-3">Productos en Tienda</h4>
            
            <div class="table-responsive">
                <table class="table table-sm align-middle">
                    <thead>
                        <tr>
                            <th>Producto</th>
                            <th>Categoría</th>
                            <th>Stock</th>
                            <th>Precio</th>
                            <th class="text-end">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-productos-body">
                    </tbody>
                </table>
            </div>
        </section>

    </main>

    <footer class="border-top py-4 text-center text-muted small mt-5 bg-white">
        © 2026 Think-Tech. Todos los derechos reservados.
    </footer>

    <!--conexion al js -->
    <script src="../../js/scripts.js"></script>
</body>
</html>
